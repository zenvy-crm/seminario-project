# Medicion de la LINEA BASE de calidad (antes de la intervencion SQA).
# Se ejecuta a mano (workflow_dispatch) sobre el commit "estado base" y deja los reportes como artefactos.
# No modifica el codigo: los analizadores se activan solo por linea de comandos.
name: Linea base de calidad

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit a medir (por defecto, el estado base antes de la intervencion)"
        required: false
        default: "0c8d13704a0de754e7ef9de7e7dc72d2bdf3c825"
      ref_frontend:
        description: "Commit del monorepo con el frontend sin intervenir"
        required: false
        default: "826501b"

jobs:
  linea-base:
    runs-on: ubuntu-latest
    env:
      PROYECTO: seminario-backend-service/seminario-backend-service.csproj
    steps:
      - name: Checkout del commit base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore "$PROYECTO"

      - name: Build con analizadores (latest-recommended + estilo)
        run: |
          set +e
          dotnet build "$PROYECTO" -c Release --no-restore \
            -p:AnalysisLevel=latest-recommended \
            -p:EnforceCodeStyleInBuild=true \
            -p:GenerateDocumentationFile=false \
            -clp:NoSummary -flp:"logfile=build-linea-base.log;verbosity=normal"
          echo "BUILD_RC=$?" >> "$GITHUB_ENV"

      - name: Contar advertencias unicas
        run: |
          grep -oE '[^ ]+\.cs\([0-9]+,[0-9]+\): warning [A-Z]+[0-9]+' build-linea-base.log \
            | sed 's#.*/seminario-backend-service/##' | sort -u > advertencias-unicas.txt || true
          TOTAL=$(wc -l < advertencias-unicas.txt)
          echo "## Linea base — advertencias del compilador/analizadores" >> "$GITHUB_STEP_SUMMARY"
          echo "Total de advertencias unicas: **$TOTAL** (build rc=$BUILD_RC)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Regla | Cantidad |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'warning [A-Z]+[0-9]+' advertencias-unicas.txt | awk '{print $2}' | sort | uniq -c | sort -rn \
            | awk '{printf "| %s | %s |\n", $2, $1}' | tee advertencias-por-regla.md >> "$GITHUB_STEP_SUMMARY"
          echo "TOTAL_ADVERTENCIAS=$TOTAL"

      - name: Verificar formato (dotnet format)
        run: |
          set +e
          dotnet format "$PROYECTO" --verify-no-changes --no-restore --report format-report.json
          echo "FORMAT_RC=$?" >> "$GITHUB_ENV"
          ARCHIVOS=$(jq '[.[].FilePath] | unique | length' format-report.json)
          CAMBIOS=$(jq '[.[].FileChanges[]] | length' format-report.json)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Linea base — formato" >> "$GITHUB_STEP_SUMMARY"
          echo "Archivos con problemas de formato/estilo: **$ARCHIVOS** · cambios requeridos: **$CAMBIOS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Pruebas automatizadas existentes
        run: |
          N=$(find . -name '*.csproj' | xargs grep -l -E 'xunit|nunit|mstest' | wc -l)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Linea base — pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo "Proyectos de prueba: **$N** · cobertura: **0 %** (no hay pruebas que ejecutar)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes de la linea base
        uses: actions/upload-artifact@v4
        with:
          name: linea-base
          path: |
            build-linea-base.log
            advertencias-unicas.txt
            advertencias-por-regla.md
            format-report.json

  linea-base-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del commit base del frontend
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_frontend }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint (reglas del proyecto)
        run: |
          set +e
          pnpm exec eslint src --ext .ts,.tsx -f json -o eslint-linea-base.json
          echo "ESLINT_RC=$?"
          node -e "const r=require('./eslint-linea-base.json');let e=0,w=0;const reg={};for(const f of r){e+=f.errorCount;w+=f.warningCount;for(const m of f.messages){reg[m.ruleId]=(reg[m.ruleId]||0)+1}};console.log('ESLINT_ERRORES='+e+' ESLINT_ADVERTENCIAS='+w);console.log(JSON.stringify(reg,null,1))"

      - name: Prettier (formato)
        run: |
          set +e
          pnpm exec prettier --check "src/**/*.{ts,tsx,json,css}" > prettier.txt 2>&1
          echo "PRETTIER_ARCHIVOS_SIN_FORMATO=$(grep -c '\[warn\] src/' prettier.txt)"

      - name: TypeScript (tsc --noEmit)
        run: |
          set +e
          pnpm exec tsc --noEmit -p tsconfig.json > tsc.txt 2>&1
          echo "TSC_ERRORES=$(grep -c 'error TS' tsc.txt)"
          head -40 tsc.txt

      - name: Pruebas existentes
        run: |
          echo "PRUEBAS_FRONTEND=$(find src -name '*.test.ts*' -o -name '*.spec.ts*' | wc -l)"
